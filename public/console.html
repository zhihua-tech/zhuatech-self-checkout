<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知华自助结算运营中心</title><link rel="stylesheet" href="/styles.css"></head><body><div class="layout"><aside class="side"><div class="logo">ZHUATECH RETAIL<small>上海如静知华信息科技有限公司</small></div><div class="nav"><div class="on">门店总览</div><div>自助收银机</div><div>商品与库存</div><div>交易与小票</div><div>防损例外</div><div>设备运维</div><div>审计中心</div></div></aside><main class="main"><header class="head"><div><h1>自助结算运营中心</h1><div class="sub">知华智慧便利店 · 浦东店</div></div><div class="status">● 门店在线</div></header><section class="metrics" id="metrics"></section><section class="cols"><div class="card"><h2>终端运行状态</h2><div class="terminals" id="terminals"></div></div><div class="card"><h2>待处理防损例外</h2><div id="exceptions"></div></div></section><section class="card" style="margin-top:18px"><h2>库存概览</h2><table><thead><tr><th>商品</th><th>SKU</th><th>售价</th><th>现存数量</th></tr></thead><tbody id="stocks"></tbody></table></section></main></div><script>fetch('/api/dashboard',{headers:{'x-api-key':'zhuatech-demo-key'}}).then(r=>r.json()).then(d=>{const L={terminals:'终端数',online:'在线终端',transactions:'交易数',sales:'销售额',activeBaskets:'进行中购物篮',openExceptions:'待处理例外'};metrics.innerHTML=Object.entries(d.metrics).map(([k,v])=>`<div class="metric"><span>${L[k]}</span><b>${k==='sales'?'¥':''}${v}</b></div>`).join('');terminals.innerHTML=d.terminals.map(x=>`<div class="terminal"><b>${x.code} · ${x.model}</b><small>${x.status} / 通道${x.laneStatus} · v${x.appVersion}</small></div>`).join('');exceptions.innerHTML=d.exceptions.filter(x=>x.status==='open').map(x=>`<div class="exception"><b>${x.type}</b><small>${x.message}</small></div>`).join('')||'<div class="sub">暂无待处理例外</div>';stocks.innerHTML=d.stocks.map(x=>{const p=d.products.find(p=>p.id===x.productId);return`<tr><td>${p?.name}</td><td>${p?.sku}</td><td>¥${p?.price}</td><td>${x.quantity}</td></tr>`}).join('')});</script></body></html>
